name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # `npm test` builds first (pretest), so this also covers the build and
      # the rendered product page. The suites run against the built bundles in
      # dist/, which is what actually ships.
      - name: Test
        run: npm test

      - name: Package
        run: npm run pack

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: focus-exe-packages
          path: dist/*.zip
          if-no-files-found: error

      - name: Validate skills
        run: node scripts/validate-skills.mjs

  deploy-page:
    # Deploy the single bundled product page (page/index.html) on every push to main.
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      # Required for GitHub Pages deployment via Actions.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run page

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/page

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5